<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG.Studio - Cộng đồng</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05070f;
            --bg-card: rgba(17, 25, 40, 0.65);
            --bg-card-hover: rgba(26, 38, 62, 0.8);
            --primary: #a855f7;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(168, 85, 247, 0.25);
            --danger: #ff4a4a;
            --success: #10b981;
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(20, 15, 45, 0.5) 0%, rgba(5, 7, 15, 1) 100%);
            background-attachment: fixed;
        }

        /* Animations */
        @keyframes orb-float-1 {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.05); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes orb-float-2 {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 50px) scale(1.1); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(0.9); }
            60% { transform: scale(1.15); }
            80% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* Ambient Glow Background */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.18;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            animation: orb-float-1 12s ease-in-out infinite;
        }
        .orb-2 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            bottom: -200px;
            right: -150px;
            animation: orb-float-2 15s ease-in-out infinite alternate;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
        }
        .btn-primary:hover::before {
            opacity: 1;
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.45);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        }
        .btn-secondary:active {
            transform: translateY(0);
        }

        /* Navigation Bar */
        header {
            background: rgba(10, 15, 26, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 40px;
            transition: all 0.3s;
        }
        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary) 70%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s;
        }
        .logo:hover {
            transform: scale(1.02);
        }
        .logo-symbol {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }
        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Community Layout */
        .community-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
        }
        .hero-banner {
            text-align: center;
            margin-bottom: 50px;
            animation: heroBannerFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes heroBannerFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-banner h2 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }
        .hero-banner p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 30px auto;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Masonry / Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            animation: postFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes postFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Staggered card fade-in animation using sibling selectors */
        .post-card:nth-child(1) { animation-delay: 50ms; }
        .post-card:nth-child(2) { animation-delay: 100ms; }
        .post-card:nth-child(3) { animation-delay: 150ms; }
        .post-card:nth-child(4) { animation-delay: 200ms; }
        .post-card:nth-child(5) { animation-delay: 250ms; }
        .post-card:nth-child(6) { animation-delay: 300ms; }

        .post-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px var(--primary-glow);
        }
        .post-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .post-card:hover .post-img {
            transform: scale(1.03);
        }
        .post-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.25);
        }
        .username {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .likes {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.02);
            font-size: 0.85rem;
            font-weight: 700;
        }
        .likes:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.15);
            transform: scale(1.05);
        }
        .likes.active {
            color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.12) !important;
            border-color: rgba(239, 68, 68, 0.2) !important;
        }
        .likes.active svg {
            animation: heartbeat 0.6s ease-out;
            fill: var(--danger);
        }
        .likes svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            transition: fill 0.3s, stroke 0.3s;
        }
        .likes.active svg {
            fill: currentColor;
            stroke: currentColor;
        }

        /* Upload Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
            animation: modalOverlayFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-card {
            background: rgba(13, 20, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1001;
        }
        .modal.active .modal-card {
            animation: modalPopIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes modalOverlayFadeIn {
            from { background: rgba(3, 4, 8, 0); backdrop-filter: blur(0px); }
            to { background: rgba(3, 4, 8, 0.82); backdrop-filter: blur(16px); }
        }
        @keyframes modalPopIn {
            from { opacity: 0; transform: scale(0.92) translateY(25px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.25);
            transform: rotate(90deg);
        }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.005);
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.02);
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
        }
        .file-input {
            display: none;
        }
        #previewArea {
            display: none;
            text-align: center;
        }
        #previewImg {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            background: #020308;
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-symbol">BG</div> Studio
            </a>
            <nav>
                <a href="index.html" class="nav-link">← Trở về Trang chủ</a>
            </nav>
        </div>
    </header>

    <div class="community-wrapper">
        <div class="hero-banner">
            <h2>Cộng đồng Sáng tạo</h2>
            <p>Khám phá và lấy cảm hứng từ những tác phẩm tuyệt vời đã được tách nền và ghép phông AI bởi cộng đồng BG.Studio</p>
            <button class="btn btn-primary" onclick="openUploadModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Đăng tác phẩm của bạn
            </button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Mock Posts -->
            <div class="post-card">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" class="post-img" alt="Post">
                <div class="post-info">
                    <div class="post-user">
                        <div class="avatar">H</div>
                        <div class="username">Hải Đăng</div>
                    </div>
                    <div class="likes" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>245</span>
                    </div>
                </div>
            </div>
            <div class="post-card">
                <img src="https://images.unsplash.com/photo-1549490349-8643362247b5?q=80&w=2574&auto=format&fit=crop" class="post-img" alt="Post">
                <div class="post-info">
                    <div class="post-user">
                        <div class="avatar" style="background: linear-gradient(135deg, #ef4444, #f97316);">T</div>
                        <div class="username">Tuấn Anh</div>
                    </div>
                    <div class="likes" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>128</span>
                    </div>
                </div>
            </div>
            <div class="post-card">
                <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop" class="post-img" alt="Post">
                <div class="post-info">
                    <div class="post-user">
                        <div class="avatar" style="background: linear-gradient(135deg, #10b981, #3b82f6);">M</div>
                        <div class="username">Minh Thư</div>
                    </div>
                    <div class="likes" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>342</span>
                    </div>
                </div>
            </div>
            <div class="post-card">
                <img src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=2574&auto=format&fit=crop" class="post-img" alt="Post">
                <div class="post-info">
                    <div class="post-user">
                        <div class="avatar" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">Q</div>
                        <div class="username">Quang Lam</div>
                    </div>
                    <div class="likes" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>89</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal Container -->
    <div class="modal" id="uploadModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeUploadModal()">&times;</button>
            <h3 class="modal-title">Đăng Tác Phẩm</h3>
            
            <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem; margin-bottom: 15px;">🖼️</div>
                <h4 style="font-size: 1.1rem; margin-bottom: 8px;">Nhấn để chọn ảnh</h4>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Chỉ hỗ trợ JPG, PNG (Tối đa 5MB)</p>
                <input type="file" class="file-input" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <div id="previewArea">
                <img id="previewImg" src="">
                <button class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1.1rem;" onclick="publishPost()">
                    🚀 Đăng tải lên Cộng đồng
                </button>
            </div>
        </div>
    </div>

    <script>
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
            resetUploadState();
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        function resetUploadState() {
            document.getElementById('dropArea').style.display = 'block';
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('dropArea').style.display = 'none';
                    document.getElementById('previewArea').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function publishPost() {
            const imgSrc = document.getElementById('previewImg').src;
            
            const postHTML = `
            <div class="post-card" style="animation: slideIn 0.5s forwards;">
                <img src="${imgSrc}" class="post-img" alt="Post">
                <div class="post-info">
                    <div class="post-user">
                        <div class="avatar" style="background: linear-gradient(135deg, #a855f7, #3b82f6);">U</div>
                        <div class="username">Bạn (Vừa xong)</div>
                    </div>
                    <div class="likes" onclick="toggleLike(this)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>0</span>
                    </div>
                </div>
            </div>`;
            
            document.getElementById('galleryGrid').insertAdjacentHTML('afterbegin', postHTML);
            closeUploadModal();
        }

        function toggleLike(element) {
            const span = element.querySelector('span');
            let count = parseInt(span.innerText);
            
            if (element.classList.contains('active')) {
                element.classList.remove('active');
                element.style.color = 'var(--text-muted)';
                element.style.background = 'rgba(255, 255, 255, 0.04)';
                span.innerText = count - 1;
            } else {
                element.classList.add('active');
                element.style.color = 'var(--danger)';
                element.style.background = 'rgba(239, 68, 68, 0.12)';
                span.innerText = count + 1;
            }
        }
    </script>
</body>
</html>
